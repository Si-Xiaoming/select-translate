<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Select Translate</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Select Translate</h1>
    <p class="sub" id="pairSub">免费划词翻译 · 网页 / PDF / IEEE</p>
  </header>

  <section>
    <h2>语言</h2>
    <div class="lang-row">
      <label class="lang-field">
        <span>源语言</span>
        <select id="sourceLang" aria-label="Source language"></select>
      </label>
      <button id="swap" type="button" class="swap" title="交换语言">⇄</button>
      <label class="lang-field">
        <span>目标语言</span>
        <select id="targetLang" aria-label="Target language"></select>
      </label>
    </div>
    <p class="hint">设置会同步到所有设备；PDF 右键菜单标题会随目标语言更新。</p>
  </section>

  <section class="howto">
    <h2>用法</h2>
    <ol>
      <li><strong>网页</strong>：选中文字，浮层显示译文</li>
      <li><strong>PDF / IEEE stamp</strong>：选中后右键 →「翻译」</li>
      <li><strong>快捷键</strong>：选中文字后按 <kbd id="howtoShortcut">Alt+T</kbd></li>
    </ol>
  </section>

  <section class="shortcut-section">
    <h2>快捷键</h2>
    <div class="shortcut-row">
      <button id="shortcutButton" type="button" class="shortcut-capture" title="点击后按下新的组合键">
        <kbd id="shortcutText">Alt+T</kbd>
      </button>
      <button id="shortcutReset" type="button" class="ghost" title="恢复默认快捷键">恢复默认</button>
    </div>
    <p class="hint" id="shortcutHint">点击上方按键框后按下新的组合键（需包含 Ctrl / Alt / ⌘）。在网页中选中文字后按下即可翻译。</p>
    <button id="openShortcuts" type="button" class="shortcut-link">打开浏览器快捷键设置（内置 PDF 阅读器等页面用得到）</button>
  </section>

  <section class="toggle-section">
    <label class="toggle-row" for="autoTranslate">
      <span><strong>自动划词翻译</strong><small>关闭后，选中文字不会自动弹出译文</small></span>
      <input id="autoTranslate" type="checkbox" />
    </label>
    <p class="hint">关闭自动翻译后，仍可用快捷键或右键菜单翻译选区。</p>
  </section>

  <section>
    <h2>手动翻译</h2>
    <div class="row">
      <input id="q" type="text" maxlength="80" placeholder="输入单词或短句…" />
      <button id="go" type="button">翻译</button>
    </div>
    <div id="out" class="out" hidden></div>
  </section>

  <section>
    <h2>最近一次</h2>
    <div id="last" class="out muted">暂无</div>
  </section>

  <footer>
    本地 PDF：扩展详情中开启「允许访问文件网址」。
  </footer>
  <script src="languages.js"></script>
  <script src="shortcut.js"></script>
  <script src="popup.js"></script>
</body>
</html>
